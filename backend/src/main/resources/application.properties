spring.application.name=AirVision
spring.datasource.url=jdbc:postgresql://db:5432/airvision
spring.datasource.username=airvision
spring.datasource.password=airvision
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mercadopago.access-token=${MP_ACCESS_TOKEN:}

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

frontend.success-url=${FRONTEND_URL:http://localhost:3000}/payment/success
frontend.failure-url=${FRONTEND_URL:http://localhost:3000}/payment/failure
frontend.pending-url=${FRONTEND_URL:http://localhost:3000}/payment/pending
backend.webhook-url=${BACKEND_PUBLIC_URL:http://localhost:8080}/api/payments/webhook